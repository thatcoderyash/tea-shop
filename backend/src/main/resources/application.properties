spring.application.name=backend

mistvale.jwt.secret=${MISTVALE_JWT_SECRET}
mistvale.jwt.expiration-ms=900000

mistvale.admin.username=${MISTVALE_ADMIN_USERNAME}
mistvale.admin.password=${MISTVALE_ADMIN_PASSWORD}

spring.datasource.url=jdbc:postgresql://localhost:5432/mistvale
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080